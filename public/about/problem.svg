<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
  <!--
    Beat 2: the pile. Crowded, but nothing runs off the frame.

    An earlier version had cards at x="-16" and out past x="320" so the pile
    would read as continuing past the edge. It did, but the viewBox clipped
    them into flat-sided slabs, which reads as a rendering fault rather than as
    depth. Every shape here stays inside 0..320 x 0..240 *after* its rotation —
    a rotated rectangle needs a bigger box than its own width and height, so
    the cards are smaller and the angles gentler than they look.

    Density comes from count and overlap instead: five screenshots and five
    unanswered messages, none of them meant to be read. At 320px on a phone the
    shapes are all that land, and the shape is "too much".
  -->

  <!-- back layer, faded so the pile has depth -->
  <g opacity="0.5">
    <g transform="rotate(-16 62 132)">
      <rect x="23" y="80" width="78" height="104" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="35" y="94" width="50" height="7" rx="3.5" fill="#e2e8f0"/>
      <rect x="35" y="108" width="34" height="7" rx="3.5" fill="#e2e8f0"/>
      <rect x="35" y="122" width="46" height="7" rx="3.5" fill="#e2e8f0"/>
      <rect x="35" y="136" width="28" height="7" rx="3.5" fill="#e2e8f0"/>
    </g>
    <g transform="rotate(14 262 128)">
      <rect x="223" y="76" width="78" height="104" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="235" y="90" width="48" height="7" rx="3.5" fill="#e2e8f0"/>
      <rect x="235" y="104" width="32" height="7" rx="3.5" fill="#e2e8f0"/>
      <rect x="235" y="118" width="44" height="7" rx="3.5" fill="#e2e8f0"/>
      <rect x="235" y="132" width="26" height="7" rx="3.5" fill="#e2e8f0"/>
    </g>
  </g>

  <!-- middle layer -->
  <g transform="rotate(-11 106 138)">
    <rect x="66" y="86" width="80" height="106" rx="11" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="79" y="101" width="54" height="7" rx="3.5" fill="#e2e8f0"/>
    <rect x="79" y="116" width="36" height="7" rx="3.5" fill="#e2e8f0"/>
    <rect x="79" y="131" width="52" height="7" rx="3.5" fill="#e2e8f0"/>
    <rect x="79" y="146" width="30" height="7" rx="3.5" fill="#e2e8f0"/>
    <rect x="79" y="161" width="44" height="7" rx="3.5" fill="#e2e8f0"/>
  </g>

  <g transform="rotate(10 216 140)">
    <rect x="176" y="88" width="80" height="106" rx="11" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="189" y="103" width="54" height="7" rx="3.5" fill="#e2e8f0"/>
    <rect x="189" y="118" width="34" height="7" rx="3.5" fill="#e2e8f0"/>
    <rect x="189" y="133" width="48" height="7" rx="3.5" fill="#e2e8f0"/>
    <rect x="189" y="148" width="28" height="7" rx="3.5" fill="#e2e8f0"/>
  </g>

  <!-- front card: straightest and brightest, so the pile has a focal point -->
  <g transform="rotate(3 161 137)">
    <rect x="118" y="80" width="86" height="114" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <rect x="132" y="96" width="50" height="7" rx="3.5" fill="#cbd5e1"/>
    <rect x="132" y="112" width="58" height="7" rx="3.5" fill="#e2e8f0"/>
    <rect x="132" y="128" width="38" height="7" rx="3.5" fill="#e2e8f0"/>
    <rect x="132" y="144" width="58" height="7" rx="3.5" fill="#e2e8f0"/>
    <rect x="132" y="160" width="44" height="7" rx="3.5" fill="#e2e8f0"/>
    <rect x="132" y="176" width="32" height="7" rx="3.5" fill="#e2e8f0"/>
  </g>

  <!-- messages thrown on top, each at its own angle -->
  <g transform="rotate(-6 77 30)">
    <rect x="10" y="14" width="134" height="32" rx="16" fill="#0f172a"/>
    <text x="26" y="35" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#ffffff">when r u free</text>
  </g>

  <g transform="rotate(9 238 39)">
    <rect x="176" y="24" width="124" height="30" rx="15" fill="#e2e8f0"/>
    <text x="191" y="44" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#334155">send yours again</text>
  </g>

  <g transform="rotate(-11 62 200)">
    <rect x="8" y="186" width="108" height="28" rx="14" fill="#e2e8f0"/>
    <text x="22" y="205" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#334155">wait what day</text>
  </g>

  <g transform="rotate(7 249 208)">
    <rect x="190" y="194" width="118" height="28" rx="14" fill="#0f172a"/>
    <text x="204" y="213" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#ffffff">did u see mine</text>
  </g>

  <g transform="rotate(-4 160 222)">
    <rect x="126" y="209" width="68" height="26" rx="13" fill="#e2e8f0"/>
    <text x="141" y="227" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#334155">?????</text>
  </g>

  <!-- unread badge: the pile is not just messy, it is owed a reply -->
  <circle cx="297" cy="17" r="13" fill="#e11d48"/>
  <text x="297" y="22" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#ffffff">7</text>
</svg>
