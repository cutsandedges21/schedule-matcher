<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta
      name="description"
      content="Share your class schedule and find the hours you and your friends are both free."
    />

    <!-- Link-preview cards (iMessage, WhatsApp, Slack, etc.) when an invite or
         a schedule link gets shared. These crawlers fetch the raw HTML and do
         not run JS, so this only works as static tags here — not anything
         rendered by React — and the image URL has to be absolute; a relative
         one is unreliable across crawlers. icon-512.png is square, hence
         "summary" rather than "summary_large_image" on the Twitter tags,
         which expects a wide banner and would crop a square image oddly. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://schedulematcher.app/" />
    <meta property="og:title" content="Schedule Matcher" />
    <meta
      property="og:description"
      content="Share your class schedule and find the hours you and your friends are both free."
    />
    <meta property="og:image" content="https://schedulematcher.app/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:type" content="image/png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Schedule Matcher" />
    <meta
      name="twitter:description"
      content="Share your class schedule and find the hours you and your friends are both free."
    />
    <meta name="twitter:image" content="https://schedulematcher.app/icon-512.png" />

    <!-- Home-screen install. The manifest is what makes Android offer a real
         install (rather than a bookmark); the apple-* tags are the iOS
         equivalent, since Safari ignores the manifest's display and name. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- "default", not "black-translucent": the app is light and does not pad
         for the status bar, so translucent would run text under the clock. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Schedule" />

    <title>Schedule Matcher</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
