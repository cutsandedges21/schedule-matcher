<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
  <!--
    Beat 2: the pile. Deliberately more crowded than it is legible.

    Six screenshots at hard angles, several running off the edge of the frame
    so the pile reads as continuing past it, and six unanswered messages thrown
    on top at their own angles. Nothing here is meant to be read — at 320px on
    a phone the shapes are all that land, and the shape is "too much".

    The earlier version was three neat cards and two tidy bubbles, which
    illustrated the subject without provoking the feeling. Chaos is the content
    of this beat.
  -->

  <!-- back layer: screenshots spilling off both edges -->
  <g opacity="0.55">
    <g transform="rotate(-22 30 120)">
      <rect x="-16" y="60" width="88" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="-2" y="76" width="58" height="7" rx="3.5" fill="#e2e8f0"/>
      <rect x="-2" y="92" width="40" height="7" rx="3.5" fill="#e2e8f0"/>
      <rect x="-2" y="108" width="54" height="7" rx="3.5" fill="#e2e8f0"/>
      <rect x="-2" y="124" width="34" height="7" rx="3.5" fill="#e2e8f0"/>
    </g>
    <g transform="rotate(18 292 108)">
      <rect x="252" y="48" width="88" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="266" y="64" width="56" height="7" rx="3.5" fill="#e2e8f0"/>
      <rect x="266" y="80" width="38" height="7" rx="3.5" fill="#e2e8f0"/>
      <rect x="266" y="96" width="50" height="7" rx="3.5" fill="#e2e8f0"/>
      <rect x="266" y="112" width="30" height="7" rx="3.5" fill="#e2e8f0"/>
    </g>
  </g>

  <!-- middle layer -->
  <g transform="rotate(-13 78 148)">
    <rect x="30" y="86" width="94" height="126" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="44" y="104" width="66" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="44" y="122" width="46" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="44" y="140" width="66" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="44" y="158" width="36" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="44" y="176" width="56" height="8" rx="4" fill="#e2e8f0"/>
  </g>

  <g transform="rotate(11 238 152)">
    <rect x="192" y="90" width="94" height="126" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="206" y="108" width="66" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="206" y="126" width="42" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="206" y="144" width="60" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="206" y="162" width="34" height="8" rx="4" fill="#e2e8f0"/>
  </g>

  <!-- front card, straightest and brightest, so the pile has a focal point -->
  <g transform="rotate(4 158 140)">
    <rect x="110" y="74" width="98" height="132" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <rect x="125" y="92" width="58" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="125" y="110" width="68" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="125" y="128" width="44" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="125" y="146" width="68" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="125" y="164" width="52" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="125" y="182" width="38" height="8" rx="4" fill="#e2e8f0"/>
  </g>

  <!-- messages thrown on top, each at its own angle -->
  <g transform="rotate(-6 84 26)">
    <rect x="10" y="10" width="134" height="32" rx="16" fill="#0f172a"/>
    <text x="26" y="31" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#ffffff">when r u free</text>
  </g>

  <g transform="rotate(9 236 40)">
    <rect x="176" y="24" width="124" height="30" rx="15" fill="#e2e8f0"/>
    <text x="191" y="44" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#334155">send yours again</text>
  </g>

  <g transform="rotate(-11 62 200)">
    <rect x="8" y="186" width="108" height="28" rx="14" fill="#e2e8f0"/>
    <text x="22" y="205" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#334155">wait what day</text>
  </g>

  <g transform="rotate(7 244 208)">
    <rect x="190" y="194" width="118" height="28" rx="14" fill="#0f172a"/>
    <text x="204" y="213" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#ffffff">did u see mine</text>
  </g>

  <g transform="rotate(-4 160 224)">
    <rect x="126" y="212" width="68" height="26" rx="13" fill="#e2e8f0"/>
    <text x="141" y="230" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#334155">?????</text>
  </g>

  <!-- unread badge: the pile is not just messy, it is owed a reply -->
  <circle cx="298" cy="16" r="13" fill="#e11d48"/>
  <text x="298" y="21" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#ffffff">7</text>
</svg>
